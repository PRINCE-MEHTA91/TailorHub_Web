services:
  # ── Node.js Backend API ──────────────────────────────────────────────────
  - type: web
    name: tailorhub-web
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # JWT secret - set via Render dashboard (never commit real value)
      - key: JWT_SECRET
        sync: false
      # Neon PostgreSQL
      - key: DATABASE_URL
        sync: false
      # Gmail SMTP
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      # Frontend URL
      - key: CLIENT_URL
        value: https://tailor-hub-web-client.vercel.app
      # CORS extra origins
      - key: ALLOWED_ORIGINS
        value: https://tailor-hub-web-client.vercel.app
      # Python measurement service
      - key: PYTHON_MEASURE_URL
        value: https://tailorhub-python.onrender.com/measure
      # OpenRouter AI (legacy - not required)
      # - key: OPENROUTER_API_KEY
      #   sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      # Google Gemini AI (primary)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false

  # ── Python MediaPipe Measurement Engine ─────────────────────────────────
  - type: web
    name: tailorhub-python
    runtime: python
    rootDir: python
    buildCommand: >
      pip install -r requirements.txt &&
      python -c "import urllib.request, os; url='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/latest/pose_landmarker_heavy.task'; path='pose_landmarker_heavy.task'; urllib.request.urlretrieve(url, path) if not os.path.exists(path) else print('Model already exists'); print('Model ready')"
    startCommand: python measure_server.py
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: MEASURE_PORT
        value: 10000
